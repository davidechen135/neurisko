[project]
name = "neurisko"
version = "0.1.0"
description = "Eurisko (Lenat, 1981) resurrected with LLMs: self-improving heuristics that find balance exploits in games"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Davide Chen", email = "dc1352733510@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.2",
]

[project.scripts]
neurisko = "neurisko.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".kiro", "docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
